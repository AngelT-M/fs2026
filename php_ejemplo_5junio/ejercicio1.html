<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <header class="py-5 bg-primary text-white shadow-sm">
        <div class="container text-center">
            <h1 class="display-6 fw-bold mb-2">Problema 1</h1>
            <p class="mb-0 opacity-75">Promedio de estudiante</p>
        </div>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 col-xl-7">
                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="h4 text-center fw-semibold mb-4">Completa los datos</h2>

                        <form action="ejercicios.php" method="get">
                            <div class="mb-3">
                                <label for="txt_nom" class="form-label">Ingresar su nombre</label>
                                <input type="text" class="form-control form-control-lg" name="txt_nom" id="txt_nom" placeholder="Ej. Juan Perez">
                            </div>

                            <div class="mb-3">
                                <label for="txt_cur" class="form-label">Ingresar nombre del curso</label>
                                <input type="text" class="form-control form-control-lg" name="txt_cur" id="txt_cur" placeholder="Ej. Matematica">
                            </div>

                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label for="num_not1" class="form-label">Ingresar nota 1</label>
                                    <input type="number" class="form-control" name="num_not1" id="num_not1" placeholder="0 - 100">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="num_not2" class="form-label">Ingresar nota 2</label>
                                    <input type="number" class="form-control" name="num_not2" id="num_not2" placeholder="0 - 100">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="num_not3" class="form-label">Ingresar nota 3</label>
                                    <input type="number" class="form-control" name="num_not3" id="num_not3" placeholder="0 - 100">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="num_not4" class="form-label">Ingresar nota 4</label>
                                    <input type="number" class="form-control" name="num_not4" id="num_not4" placeholder="0 - 100">
                                </div>
                                <div class="col-12">
                                    <label for="num_not5" class="form-label">Ingresar nota 5</label>
                                    <input type="number" class="form-control" name="num_not5" id="num_not5" placeholder="0 - 100">
                                </div>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" name="btn_prome" id="btn_prome" class="btn btn-primary btn-lg fw-semibold">
                                    Calcular promedio
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
